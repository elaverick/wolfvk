name: Windows build and tests

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.309.0
          install_runtime: true
          install_swiftshader: true
          cache: true
          github_token: ${{ github.token }}

      - name: Configure
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        shell: pwsh
        run: |
          $env:VK_ICD_FILENAMES = "C:\swiftshader\vk_swiftshader_icd.json"
          ctest --test-dir build -C Release --output-on-failure

      # The game draws actors and objects from voxel models that users build
      # from their own VSWAP.WL6, so the demo ships the voxelizer as well.
      # Its tests run in the sprite-voxelizer job below.
      - name: Build sprite voxelizer for the demo
        run: |
          cmake -S tools/sprite_voxelizer -B build-tools -A x64 -DBUILD_TESTING=OFF
          cmake --build build-tools --config Release --parallel

      - name: Build WL6 audio extractor for the demo
        run: |
          cmake -S tools/audio_extractor -B build-audio -A x64 -DBUILD_TESTING=OFF
          cmake --build build-audio --config Release --parallel

      - name: Package textured Windows demo
        if: success()
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:GITHUB_WORKSPACE "demo-package"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item -Path "build\Release\wolfvk.exe" -Destination $packageDir
          Copy-Item -Path "build-tools\Release\wolf_sprite_voxelizer.exe" -Destination $packageDir
          Copy-Item -Path "build-audio\Release\wolf_audio_extractor.exe" -Destination $packageDir
          Copy-Item -Path "build\Release\shaders" -Destination $packageDir -Recurse
          Copy-Item -Path "THIRD_PARTY_NOTICES.txt" -Destination $packageDir

          $instructions = @'
          WolfVK - textured Windows demo
          ==============================

          Requirements
          - 64-bit Windows
          - A Vulkan-capable graphics device and current graphics driver
          - Original Wolfenstein 3D WL6 map, wall, VGA graphics and audio data (not included)

          Setup
          1. Copy MAPHEAD.WL6, GAMEMAPS.WL6 and VSWAP.WL6 from your own WL6
             installation into this folder, beside wolfvk.exe. Copy VGAHEAD.WL6,
             VGADICT.WL6 and VGAGRAPH.WL6 as well to show the status bar.
          2. Keep the shaders folder beside wolfvk.exe.
          3. Build the voxel actors and objects from your VSWAP.WL6 (about 25 s):
               wolf_sprite_voxelizer.exe --vswap VSWAP.WL6 --output voxelizer-output --assets assets\voxels
             Without assets\voxels the game still runs, but with no actors or objects.
          4. Copy AUDIOHED.WL6 and AUDIOT.WL6 from your WL6 installation as well.
             Install FFmpeg with libvorbis and add ffmpeg.exe to PATH, then extract
             the original AdLib and digitised effects into assets\sounds:
               wolf_audio_extractor.exe --vswap VSWAP.WL6 --audiohed AUDIOHED.WL6 --audiot AUDIOT.WL6 --output assets\sounds
             The 27 AdLib music tracks are not yet converted.
          5. Run wolfvk.exe. Use --level N to select a one-based level number and
             --difficulty 1-4 to choose which enemies appear (default 3).

          Controls
          - W / A / S / D: move
          - Mouse: look
          - Left mouse button or Left Ctrl: fire
          - 1 / 2 / 3 / 4: select knife / pistol / machine gun / chaingun
          - Right shoulder or right trigger on a gamepad: fire
          - Escape: quit

          The mouse is captured while the window is focused. Wall textures and animated
          door panels are loaded from VSWAP.WL6. Press E or Space to operate doors
          and marked secret pushwalls; locked doors require their matching key.
          The four voxel weapons are anchored to the player's view and use the original
          six-tic attack animation timing. Each shot uses a bullet, and the knife comes
          out when they run out. Player shots and knife strikes can damage guards,
          officers, SS soldiers and mutants; kills award score and can drop ammunition.
          The four enemy families use shared 70 Hz perception and pursuit with their
          original family-specific attack, pain and death sequences. Walk towards keys,
          health, ammunition, weapons and treasure to pick them up; you start with the
          knife and pistol, and 1-4 select only weapons you have found.
          The original status bar is drawn at a whole-number scale below the view;
          integer scaling of the 3D scene remains a follow-on step.
          '@
          Set-Content -LiteralPath (Join-Path $packageDir "README.txt") -Value $instructions -Encoding utf8
          Compress-Archive -Path (Join-Path $packageDir "*") -DestinationPath "build\WolfVK-textured-demo-windows-x64.zip" -Force

      - name: Upload textured Windows demo
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WolfVK-textured-demo-windows-x64
          path: build/WolfVK-textured-demo-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  # The offline sprite voxelizer is a separate CMake project under tools/.
  # Its tests use synthetic original-format data, so no game files are needed.
  sprite-voxelizer:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S tools/sprite_voxelizer -B build-tools -A x64 -DBUILD_TESTING=ON

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S tools/sprite_voxelizer -B build-tools -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build-tools --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build-tools -C Release --output-on-failure

  # The offline WL6 audio extractor is validated using synthetic VSWAP pages.
  audio-extractor:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S tools/audio_extractor -B build-audio -A x64 -DBUILD_TESTING=ON

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S tools/audio_extractor -B build-audio -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build-audio --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build-audio -C Release --output-on-failure
