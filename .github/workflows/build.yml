name: Windows build and tests

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.309.0
          install_runtime: true
          install_swiftshader: true
          cache: true

      - name: Configure
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        shell: pwsh
        run: |
          $env:VK_ICD_FILENAMES = "C:\swiftshader\vk_swiftshader_icd.json"
          ctest --test-dir build -C Release --output-on-failure

      - name: Package pre-texture Windows demo
        if: success()
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:GITHUB_WORKSPACE "demo-package"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item -Path "build\Release\wolfvk.exe" -Destination $packageDir
          Copy-Item -Path "build\Release\shaders" -Destination $packageDir -Recurse
          Copy-Item -Path "THIRD_PARTY_NOTICES.txt" -Destination $packageDir

          $instructions = @'
          WolfVK - pre-texture Windows demo
          ==================================

          Requirements
          - 64-bit Windows
          - A Vulkan-capable graphics device and current graphics driver
          - Original Wolfenstein 3D WL6 map data (not included)

          Setup
          1. Copy MAPHEAD.WL6 and GAMEMAPS.WL6 from your own WL6 installation
             into this folder, beside wolfvk.exe.
          2. Keep the shaders folder beside wolfvk.exe.
          3. Run wolfvk.exe. Use --level N to select a one-based level number.

          Controls
          - W / A / S / D: move
          - Mouse: look
          - Escape: quit

          The mouse is captured while the window is focused. Textures, sprites,
          enemies, pickups and doors are not part of this pre-texture milestone.
          '@
          Set-Content -LiteralPath (Join-Path $packageDir "README.txt") -Value $instructions -Encoding utf8
          Compress-Archive -Path (Join-Path $packageDir "*") -DestinationPath "build\WolfVK-demo-windows-x64.zip" -Force

      - name: Upload pre-texture Windows demo
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WolfVK-demo-windows-x64
          path: build/WolfVK-demo-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
